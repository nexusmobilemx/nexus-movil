function fechaLimiteDefault_(){ const a = new Date(); const b = new Date(a.getFullYear(), a.getMonth(), a.getDate() + (a.getHours() >= 18 ? 1 : 0)); const p = n=> String(n).padStart(2, '0'); return b.getFullYear() + '-' + p(b.getMonth() + 1) + '-' + p(b.getDate()); }
function tgAlerta_(t){
  if(!t.fechaLimite || t.estado === 'completada' || t.estado === 'cancelada') return { cls:'', label:'' };
  const dif = Math.round((new Date(t.fechaLimite) - new Date(hoyISO_())) / 86400000);
  if(dif < 0) return { cls:'vencida', label:'Vencida' };
  if(dif <= 2) return { cls:'pronto', label: dif === 0 ? 'Vence hoy' : `Vence en ${dif} día${dif === 1 ? '' : 's'}` };
  return { cls:'', label:'' };
}
function tgDelCliente_(t, corto){
  const a = norm_(t.cliente), k = norm_(corto); if(!a || !k) return false; if(a === k) return true;
  const row = clientePorCorto_(corto); return !!row && a === norm_(cfVal(row, 'RAZON SOCIAL'));
}
function tgCoincide_(t){
  const corto = TG_CLI || (CLI ? CLI['CLIENTE CORTO'] : '');
  if(corto) return tgDelCliente_(t, corto);
  const q = TG_Q.trim(); if(!q) return true;
  if(esNumerico_(q)){
    const d = normalizeSearch(q);
    const nums = ((t.titulo || '') + ' ' + (t.descripcion || '') + ' ' + (t.ultima ? t.ultima.nota : '')).match(/\d[\d\s\-.]*\d/g) || [];
    return nums.some(n=>{ const x = n.replace(/\D/g, ''); return d.length >= 8 ? (x === d || x.slice(-10) === d) : x.includes(d); });
  }
  const h = norm_(t.titulo + ' ' + t.descripcion + ' ' + t.cliente + ' ' + nombreCliente_(t.cliente));
  return norm_(q).split(/\s+/).every(p=> h.includes(p));
}
function nombreCliente_(corto){ const r = clientePorCorto_(corto); return r ? razonDe_(r) : corto; }
function tgPintar_(){
  estadoCarga_('tgEstado', 'tareas', DATA.tareas.length, 'tareas');
  const buscando = !!(TG_CLI || (CLI && CLI['CLIENTE CORTO']) || esNumerico_(TG_Q));
  const pasa = t=> buscando ? t.estado !== 'cancelada' : TG_FILTRO === 'todos' ? true : TG_FILTRO === 'actuales' ? ['pendiente', 'proceso', 'en_espera'].includes(t.estado) : t.estado === TG_FILTRO;
  const filtros = [['actuales', 'Actuales'], ['pendiente', 'Pendiente'], ['proceso', 'En proceso'], ['en_espera', 'En espera'], ['completada', 'Completada'], ['todos', 'Todas'], ['cancelada', 'Cancelada']];
  const cuenta = k=> DATA.tareas.filter(t=> k === 'todos' ? true : k === 'actuales' ? ['pendiente', 'proceso', 'en_espera'].includes(t.estado) : t.estado === k).length;
  $('tgFiltros').innerHTML = filtros.map(([k, l])=> `<button type="button" class="chip${!buscando && TG_FILTRO === k ? ' active' : ''}" data-f="${k}">${l}<span class="c">${cuenta(k)}</span></button>`).join('');
  const lista = DATA.tareas.filter(t=> pasa(t) && tgCoincide_(t)).sort((a, b)=>{
    const ca = norm_(nombreCliente_(a.cliente)), cb = norm_(nombreCliente_(b.cliente));
    if(!ca && cb) return 1; if(!cb && ca) return -1; if(ca !== cb) return ca < cb ? -1 : 1;
    const pa = EST_ORDEN[a.estado] ?? 9, pb = EST_ORDEN[b.estado] ?? 9; if(pa !== pb) return pa - pb;
    return (a.fechaLimite || '9999') < (b.fechaLimite || '9999') ? -1 : 1;
  });
  $('tgLista').innerHTML = lista.length ? lista.map(t=>{
    const al = tgAlerta_(t);
    return `<div class="tarea-card borde-${t.estado}" data-no="${t.no}">
      <div class="tg-top"><div class="tg-cli">${esc(t.cliente ? nombreCliente_(t.cliente) : '—')}</div><span class="estatus est-${t.estado}">${EST_LBL[t.estado]}</span></div>
      <div class="tg-tit">${esc(t.titulo)}</div>
      ${t.descripcion ? `<div class="tg-ult" style="margin-top:2px">${esc(t.descripcion)}</div>` : ''}
      <div class="tg-ult">${t.ultima ? `<b style="color:var(--text-faint); font-weight:500">${esc(fecha_(t.ultima.fecha))}${t.ultima.usuario ? ' · ' + esc(t.ultima.usuario) : ''}:</b> ${esc(t.ultima.nota)}${t.numAct > 1 ? ` <span style="color:var(--cyan)">(${t.numAct})</span>` : ''}` : '<span class="vacio">Sin actualizaciones</span>'}</div>
      <div class="tg-meta"><span>${esc(RESP[t.responsable] || '—')} · #${t.no}</span><span class="${al.cls}">${esc(al.label || (t.fechaLimite ? fecha_(t.fechaLimite) : 'Sin fecha'))}</span></div>
    </div>`;
  }).join('') : '<div class="vacio-panel">No hay tareas que coincidan.</div>';
}
$('tgFiltros').addEventListener('click', e=>{ const b = e.target.closest('[data-f]'); if(!b) return; TG_FILTRO = b.dataset.f; TG_CLI = ''; TG_Q = ''; $('tgInput').value = ''; clienteActivoQuitar_(); tgPintar_(); });
$('tgInput').addEventListener('input', ()=>{ TG_Q = $('tgInput').value; if(TG_CLI && norm_(TG_Q) !== norm_(TG_CLI)) TG_CLI = ''; tgPintar_(); });
sugerenciasCliente_('tgInput', 'tgSug', row=>{ TG_CLI = row['CLIENTE CORTO'] || ''; $('tgInput').value = TG_CLI; TG_Q = TG_CLI; clienteActivoSet_(row); tgPintar_(); });
$('tgLista').addEventListener('click', e=>{ const c = e.target.closest('[data-no]'); if(c) tgAbrir_(+c.dataset.no); });
ENTRAR.tareas = ()=>{ if(CLI){ TG_CLI = CLI['CLIENTE CORTO'] || ''; $('tgInput').value = TG_CLI; TG_Q = TG_CLI; } tgPintar_(); };
QUITAR_CLIENTE.tareas = ()=>{ TG_CLI = ''; TG_Q = ''; $('tgInput').value = ''; tgPintar_(); };
alCargar_('tareas', ()=>{ if(VISTA === 'tareas') tgPintar_(); });
alCargar_('clientes', ()=>{ if(VISTA === 'tareas') tgPintar_(); });

/* Mayúsculas al capturar (mismo criterio del escritorio) */
['tnCliente', 'tnTitulo', 'tnDesc', 'tdCliente', 'tdTitulo', 'tdDesc', 'tdNota', 'tkAsunto', 'tkDetalle'].forEach(id=>{
  const el = $(id); el.addEventListener('input', ()=>{ const a = el.selectionStart, b = el.selectionEnd, v = el.value.toUpperCase(); if(v !== el.value){ el.value = v; try{ el.setSelectionRange(a, b); }catch(e){} } });
});
['tn', 'td'].forEach(p=> $(p + 'Cliente').addEventListener('input', ()=>{ const r = clientePorCorto_($(p + 'Cliente').value.trim()); $(p + 'Razon').textContent = r ? razonDe_(r) : ''; }));
// Nueva tarea: botón del encabezado en todas las vistas (42.12); con cliente activo sale ya con ese cliente.
$('btnNuevaTarea').addEventListener('click', ()=>{
  $('tnCliente').value = CLI ? (CLI['CLIENTE CORTO'] || '') : ''; $('tnRazon').textContent = CLI ? razonDe_(CLI) : '';
  $('tnTitulo').value = ''; $('tnDesc').value = ''; $('tnResp').value = 'lucero'; $('tnFecha').value = fechaLimiteDefault_(); $('tnMsg').textContent = '';
  abrirOv_('ov-tarea-nueva');
});
$('tnCrear').addEventListener('click', async ()=>{
  const titulo = $('tnTitulo').value.trim();
  if(!titulo){ $('tnMsg').textContent = 'Escribe la tarea.'; return; }
  const resp = $('tnResp').value, cliente = $('tnCliente').value.trim();
  const datos = { cliente, titulo, descripcion: $('tnDesc').value.trim(), responsableLabel: RESP[resp], estadoLabel: EST_LBL.pendiente, fechaCreacion: hoyISO_(), fechaLimite: $('tnFecha').value, creadoPor: usuarioNombre_() || 'NEXUS' };
  const b = $('tnCrear'); b.disabled = true; $('tnMsg').textContent = 'Guardando…';
  try{
    const r = await post_({ action:'crearTareaRemota', datos });
    DATA.tareas.push({ no: r.no, cliente, titulo, descripcion: datos.descripcion, responsable: resp, estado:'pendiente', fechaCreacion: datos.fechaCreacion, fechaLimite: datos.fechaLimite, fechaCompletado:'', creadoPor: datos.creadoPor, completadoPor:'', numAct:0, ultima:null });
    cacheSet('tareas', DATA.tareas);
    notificar(`Tarea #${r.no} creada.`, 'ok');
    cerrarOv_('ov-tarea-nueva');
    if(VISTA === 'tareas') tgPintar_();
  }catch(err){ $('tnMsg').textContent = 'No se pudo guardar: ' + err.message; }
  b.disabled = false;
});
function tgAbrir_(no){
  const t = DATA.tareas.find(x=> x.no === no); if(!t) return;
  TG_ACTIVA = no;
  $('tdTit').textContent = 'Tarea #' + no;
  $('tdMeta').textContent = `Creada el ${fecha_(t.fechaCreacion)} por ${t.creadoPor || '—'}${t.fechaCompletado ? ` · completada el ${fecha_(t.fechaCompletado)}${t.completadoPor ? ' por ' + t.completadoPor : ''}` : ''}`;
  $('tdCliente').value = t.cliente || ''; $('tdRazon').textContent = t.cliente ? nombreCliente_(t.cliente) : '';
  $('tdTitulo').value = t.titulo; $('tdDesc').value = t.descripcion || ''; $('tdResp').value = t.responsable; $('tdFecha').value = t.fechaLimite || ''; $('tdMsg').textContent = ''; $('tdNota').value = '';
  tgPintarEstados_(t);
  abrirOv_('ov-tarea-detalle');
  tgCargarBitacora_(no);
}
function tgPintarEstados_(t){ $('tdEstados').innerHTML = Object.keys(EST_LBL).map(k=> `<button type="button" data-e="${k}" class="${k === t.estado ? 'est-' + k : ''}" style="${k === t.estado ? 'border-color:transparent; font-weight:600' : ''}">${EST_LBL[k]}</button>`).join(''); }
async function tgGuardar_(t, cambios){
  const n = Object.assign({}, t, cambios);
  if(n.estado === 'completada' && t.estado !== 'completada'){ n.fechaCompletado = hoyISO_(); n.completadoPor = usuarioNombre_(); }
  else if(n.estado !== 'completada'){ n.fechaCompletado = ''; n.completadoPor = ''; }
  await post_({ action:'actualizarTareaRemota', datos:{ no: n.no, cliente: n.cliente, titulo: n.titulo, descripcion: n.descripcion, responsableLabel: RESP[n.responsable] || n.responsable, estadoLabel: EST_LBL[n.estado], fechaLimite: n.fechaLimite, fechaCompletado: n.fechaCompletado, completadoPor: n.completadoPor } });
  Object.assign(t, n); cacheSet('tareas', DATA.tareas);
}
$('tdEstados').addEventListener('click', async e=>{
  const b = e.target.closest('[data-e]'); if(!b) return;
  const t = DATA.tareas.find(x=> x.no === TG_ACTIVA); if(!t || t.estado === b.dataset.e) return;
  try{ await tgGuardar_(t, { estado: b.dataset.e }); tgPintarEstados_(t); notificar(`Tarea #${t.no}: ${EST_LBL[t.estado]}`, 'ok'); if(VISTA === 'tareas') tgPintar_(); }
  catch(err){ notificar('No se pudo guardar el estatus: ' + err.message, 'error'); }
});
$('tdGuardar').addEventListener('click', async ()=>{
  const t = DATA.tareas.find(x=> x.no === TG_ACTIVA); if(!t) return;
  const titulo = $('tdTitulo').value.trim(); if(!titulo){ $('tdMsg').textContent = 'La tarea no puede quedar vacía.'; return; }
  const b = $('tdGuardar'); b.disabled = true; $('tdMsg').textContent = 'Guardando…';
  const descAntes = t.descripcion || '';
  try{
    await tgGuardar_(t, { cliente: $('tdCliente').value.trim(), titulo, descripcion: $('tdDesc').value.trim(), responsable: $('tdResp').value, fechaLimite: $('tdFecha').value });
    if(t.descripcion !== descAntes) post_({ action:'agregarSeguimientoTarea', noTarea: t.no, nota: `Descripción actualizada: "${t.descripcion || '(vacía)'}"`, usuario: usuarioNombre_() }).catch(()=>{});
    $('tdMsg').textContent = ''; delete $('ov-tarea-detalle').dataset.sucio;
    notificar('Cambios guardados.', 'ok');
    if(VISTA === 'tareas') tgPintar_();
  }catch(err){ $('tdMsg').textContent = 'No se pudo guardar: ' + err.message; }
  b.disabled = false;
});
async function tgCargarBitacora_(no){
  $('tdBitacora').innerHTML = '';
  try{
    const r = await fetch(`${APPS_SCRIPT_URL}?action=obtenerSeguimientoTarea&noTarea=${encodeURIComponent(no)}`).then(x=> x.json());
    if(TG_ACTIVA !== no) return;
    $('tdBitacora').innerHTML = (r.eventos || []).map(ev=> `<div><b>${esc(ev.fecha || '')}${ev.hora ? ' ' + esc(ev.hora) : ''} · ${esc(ev.usuario || 'NEXUS')}:</b> ${esc(ev.nota || '')}</div>`).join('') || '<div class="vacio">Sin actualizaciones.</div>';
  }catch(err){ $('tdBitacora').innerHTML = `<div class="vacio">No se pudo cargar la bitácora (${esc(err.message)}).</div>`; }
}
async function tgAgregarNota_(){
  const nota = $('tdNota').value.trim(); if(!nota || !TG_ACTIVA) return;
  const b = $('tdNotaBtn'); b.disabled = true;
  try{
    await post_({ action:'agregarSeguimientoTarea', noTarea: TG_ACTIVA, nota, usuario: usuarioNombre_() });
    const t = DATA.tareas.find(x=> x.no === TG_ACTIVA);
    if(t){ const d = new Date(); t.ultima = { nota, fecha: hoyISO_(), hora: String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'), usuario: usuarioNombre_() }; t.numAct = (t.numAct || 0) + 1; }
    $('tdNota').value = ''; delete $('ov-tarea-detalle').dataset.sucio;
    tgCargarBitacora_(TG_ACTIVA);
    if(VISTA === 'tareas') tgPintar_();
  }catch(err){ notificar('No se pudo guardar la actualización: ' + err.message, 'error'); }
  b.disabled = false;
}
$('tdNotaBtn').addEventListener('click', tgAgregarNota_);
$('tdNota').addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); tgAgregarNota_(); } });
</script>

<script>
/* ============================================================================
   PRECIOS AK (42.9, 42.10): marcas + Disponible; precio público, DAT y margen; detalle por color
   ============================================================================ */
let PAK_MARCA = '', PAK_DISP = true, PAK_Q = '', PAK_ABIERTOS = new Set(), PAK_EXIST = {};
const PAK_MARCAS_TOP = ['APPLE', 'SAMSUNG', 'MOTOROLA', 'XIAOMI'];
function pakClaveNorm_(s){ const l = String(s || '').toUpperCase().trim().replace(/[\s\-_.]/g, ''); return [l, l.replace(/^0+(?=\d)/, '')]; }
alCargar_('exist', ()=>{ PAK_EXIST = {}; DATA.exist.forEach(r=>{ const [a, b] = pakClaveNorm_(r['MATERIAL']); if(a){ PAK_EXIST[a] = r; if(b) PAK_EXIST[b] = r; } }); pakAplicarRun_(); if(VISTA === 'preciosak') pakPintar_(); });
// 13OCTV1-MOVIL (2026-10-13, a petición de César, #51 P23): el "n disp." incluye el inventario RUNNING (por el MATERIAL que
// identificó el escritorio al pegarlo), con la etiqueta RUNNING. Los que no se identificaron no se muestran en el móvil.
function pakAplicarRun_(){ DATA.exist.forEach(r=>{ delete r.__run; }); DATA.run.forEach(x=>{ const [a, b] = pakClaveNorm_(x['MATERIAL']); const r = a && (PAK_EXIST[a] || PAK_EXIST[b]); if(r) r.__run = (r.__run || 0) + (Number(x['DISPONIBLE']) || 0); }); }
function pakExist_(f){ const n = Number(f['CD01']); return (isNaN(n) ? 0 : n) + (Number(f.__run) || 0); }
alCargar_('run', ()=>{ pakAplicarRun_(); if(VISTA === 'preciosak') pakPintar_(); });
function pakColores_(row){ return String(row['CLAVE SAP'] || '').split(/[,;\s]+/).filter(Boolean).map(c=>{ const [a, b] = pakClaveNorm_(c); return PAK_EXIST[a] || PAK_EXIST[b] || null; }).filter(Boolean); }
function pakCruce_(colores){
  if(!colores.length) return null;
  let cd01 = 0, run = 0, dist = null, pub = null;
  colores.forEach(f=>{ cd01 += pakExist_(f); run += Number(f.__run) || 0; if(dist === null && f['PRECIO DISTRIBUIDOR'] !== '' && f['PRECIO DISTRIBUIDOR'] != null) dist = f['PRECIO DISTRIBUIDOR']; if(pub === null && f['PRECIO PÚBLICO'] !== '' && f['PRECIO PÚBLICO'] != null) pub = f['PRECIO PÚBLICO']; });
  const d = Number(dist), p = Number(pub);
  return { cd01, run, dist, pub, margen: (!isNaN(d) && !isNaN(p) && p) ? p - d : null };
}
function pakModelo_(marca, modelo){ const m = String(modelo || '').trim(), b = String(marca || '').trim(); if(b && m.toUpperCase().startsWith(b.toUpperCase())){ const r = m.slice(b.length).replace(/^[\s\-]+/, ''); if(r) return r; } return m; }
function pakPintarMarcas_(){
  $('pakMarcas').innerHTML = PAK_MARCAS_TOP.map(m=> `<button type="button" class="chip${PAK_MARCA === m ? ' active' : ''}" data-m="${m}">${m.charAt(0) + m.slice(1).toLowerCase()}</button>`).join('');
  const todas = Array.from(new Set(DATA.pak.map(r=> String(r['MARCA'] || '').trim().toUpperCase()).filter(Boolean))).sort();
  $('pakTodas').innerHTML = '<option value="">Todas las marcas</option>' + todas.map(m=> `<option value="${esc(m)}" ${m === PAK_MARCA ? 'selected' : ''}>${esc(m)}</option>`).join('');
  const d = $('pakDisp'); d.style.background = PAK_DISP ? '#10B981' : 'transparent'; d.style.color = PAK_DISP ? '#04241A' : '#10B981'; d.setAttribute('aria-pressed', PAK_DISP ? 'true' : 'false');
}
function pakPintar_(){
  estadoCarga_('pakEstado', 'pak', DATA.pak.length, 'equipos');
  pakPintarMarcas_();
  const q = norm_(PAK_Q);
  const lista = DATA.pak.map(r=>{ const colores = pakColores_(r); return { r, colores, c: pakCruce_(colores) }; })
    .filter(x=> (!PAK_MARCA || norm_(x.r['MARCA']) === PAK_MARCA) && (!PAK_DISP || (x.c && x.c.cd01 > 0))
      && (!q || norm_(x.r['MARCA'] + ' ' + x.r['MODELO']).includes(q) || norm_(x.r['CLAVE SAP']).replace(/\s/g, '').includes(q.replace(/\s/g, ''))))
    .sort((a, b)=>{ const pa = a.c ? num_(a.c.pub) : null, pb = b.c ? num_(b.c.pub) : null; if(pa === null && pb !== null) return 1; if(pb === null && pa !== null) return -1; return (pa || 0) - (pb || 0); });
  const lu = esLucero_();
  $('pakLista').innerHTML = lista.length ? lista.slice(0, 300).map(({ r, colores, c })=>{
    const clave = String(r['CLAVE SAP'] || ''), abierto = PAK_ABIERTOS.has(clave), conExist = colores.filter(f=> pakExist_(f) > 0);
    return `<div class="renglon toque" data-clave="${esc(clave)}"><div class="riel" style="${c && c.cd01 > 0 ? 'background:var(--green)' : ''}"></div><div class="cuerpo">
      <div style="display:flex; justify-content:space-between; gap:8px; align-items:flex-start;">
        <div style="min-width:0"><div style="font-size:12px; color:#FFFFFF">${esc(r['MARCA'])}</div><div style="font-size:16px; font-weight:600; color:var(--cyan); line-height:1.2">${esc(pakModelo_(r['MARCA'], r['MODELO']))}</div></div>
        <div style="text-align:right; flex:0 0 auto"><div class="k">Público</div><div class="num" style="font-size:23px; line-height:1.1">${c ? esc(mon_(c.pub, 0)) : '—'}</div></div>
      </div>
      <div style="display:flex; justify-content:space-between; margin-top:6px; font-size:13px; color:var(--text-faint);">
        ${lu ? '<span></span>' : `<span>DAT <span class="num" style="font-size:15px; color:var(--text-dim)">${c ? esc(mon_(c.dist, 0)) : '—'}</span></span><span>Margen <span class="num" style="font-size:15px; color:var(--green)">${c && c.margen !== null ? esc(mon_(c.margen, 0)) : '—'}</span></span>`}
        <span style="color:var(--cyan)">${c ? c.cd01 : 0} disp.${c && c.run ? ` <span style="background:#E0A857; color:#08111f; border-radius:99px; padding:0 6px; font-size:10px; font-weight:800">RUNNING ${c.run}</span>` : ''} ${conExist.length ? (abierto ? '▴' : '▾') : ''}</span>
      </div>
      ${abierto && conExist.length ? `<div style="margin-top:8px; border-top:1px dashed #2B4A7A; padding-top:6px;">${conExist.map(f=> `<div style="display:grid; grid-template-columns:86px 1fr 40px; gap:6px; padding:3px 0; font-size:13px;"><span class="num copiable" data-copiar="${esc(f['MATERIAL'])}" style="font-size:15px; color:var(--text-faint)">${esc(f['MATERIAL'])}</span><span>${esc(f['COLOR'] || '—')}</span><span class="num" style="text-align:right; font-size:16px">${pakExist_(f)}${f.__run ? ' <span style="color:#E0A857; font-size:10px; font-weight:800">R</span>' : ''}</span></div>`).join('')}</div>` : ''}
    </div></div>`;
  }).join('') + (lista.length > 300 ? `<div class="vacio-panel">Se muestran 300 de ${lista.length}; usa la búsqueda o una marca.</div>` : '') : '<div class="vacio-panel">Ningún equipo coincide.</div>';
}
$('pakMarcas').addEventListener('click', e=>{ const b = e.target.closest('[data-m]'); if(!b) return; PAK_MARCA = PAK_MARCA === b.dataset.m ? '' : b.dataset.m; pakPintar_(); });
$('pakTodas').addEventListener('change', ()=>{ PAK_MARCA = $('pakTodas').value; pakPintar_(); });
$('pakDisp').addEventListener('click', ()=>{ PAK_DISP = !PAK_DISP; pakPintar_(); });
$('pakInput').addEventListener('input', ()=>{ PAK_Q = $('pakInput').value; pakPintar_(); });
$('pakLista').addEventListener('click', e=>{ if(e.target.closest('.copiable')) return; const c = e.target.closest('[data-clave]'); if(!c) return; const k = c.dataset.clave; PAK_ABIERTOS.has(k) ? PAK_ABIERTOS.delete(k) : PAK_ABIERTOS.add(k); pakPintar_(); });
// Igual que el escritorio (#12): cada vez que se entra, Disponible activo y ordenado por precio de menor a mayor.
ENTRAR.preciosak = ()=>{ PAK_DISP = true; cargar('pak'); cargar('exist'); cargar('run'); pakPintar_(); };
alCargar_('pak', ()=>{ if(VISTA === 'preciosak') pakPintar_(); });

/* ============================================================================
   COTIZACIÓN (42.15): lista resumida (enganche y monto a arrendar) y detalle; solo consulta
   ============================================================================ */
const COT_DET = {};   // folio -> líneas (todas las versiones)
let COT_Q = '', COT_ABIERTO = null, COT_CARGANDO = new Set();
function cotFolios_(){
  const por = {};
  DATA.cot.forEach(c=>{ const f = c['FOLIO COTIZACIÓN']; if(!por[f] || (+c['VERSIÓN'] || 1) >= (+por[f]['VERSIÓN'] || 1)) por[f] = c; });
  return Object.values(por);
}
function cotLineasV_(folio){ const l = COT_DET[folio] || []; const v = Math.max(1, ...l.map(x=> +x['VERSIÓN'] || 1)); return l.filter(x=> (+x['VERSIÓN'] || 1) === v); }
function cotEstado_(folio){
  const l = cotLineasV_(folio); if(!COT_DET[folio]) return null;
  const e = l.map(x=> String(x.ESTATUS || '').trim());
  if(e.length && e.every(x=> x === 'Descartada')) return { t:'Descartada', c:'#5F5E5A', d:true };
  const ts = DATA.trm.filter(t=> String(t['FOLIO COTIZACIÓN'] || '') === folio);
  if(ts.length && ts.every(t=> trmEstatus_(t) === 'CANCELADO')) return { t:'Cancelada', c:'#791F1F' };
  if(!e.length) return { t:'Sin líneas', c:'#633806' };
  if(e.every(x=> x === 'Aprobada' || x === 'Rechazada') && e.includes('Aprobada')) return { t:'Aceptada', c:'#0F6E56' };
  if(e.every(x=> x === 'Rechazada')) return { t:'Vencida', c:'#5F5E5A' };
  return { t:'Pendiente', c:'#854F0B' };
}
async function cotCargarDetalle_(folio){
  if(COT_DET[folio] || COT_CARGANDO.has(folio)) return;
  COT_CARGANDO.add(folio);
  const c = await cacheGet('cotdet_' + folio); if(c && !COT_DET[folio]){ COT_DET[folio] = c; cotRepintar_(); }
  try{
    const r = await fetch(APPS_SCRIPT_URL + '?action=getCotizacionDetalle&folio=' + encodeURIComponent(folio)).then(x=> x.json());
    if(r && r.rows){ COT_DET[folio] = r.rows; cacheSet('cotdet_' + folio, r.rows); cotRepintar_(); }
  }catch(e){}
  COT_CARGANDO.delete(folio);
}
let COT_REP_T = null;
function cotRepintar_(){ clearTimeout(COT_REP_T); COT_REP_T = setTimeout(()=>{ if(VISTA === 'cotizacion'){ if(COT_ABIERTO) cotPintarDetalle_(); else cotPintar_(); } }, 150); }
function cotTipo_(lineas, resumen){
  const trs = new Set(lineas.map(l=> String(l.TR || '').toUpperCase()));
  const n = lineas.length || +resumen['CANTIDAD DE LÍNEAS'] || 0;
  if(!lineas.length) return `${n} línea(s)`;
  const nuevas = [...trs].some(x=> ['N', 'M', 'P'].includes(x)), ren = trs.has('R');
  return `${n} ${nuevas && ren ? 'mixtas' : ren ? (n === 1 ? 'renovación' : 'renovaciones') : (n === 1 ? 'nueva' : 'nuevas')}`;
}
// Montos: si el resumen de la cotización no los trae (0 o vacío), se suman de sus líneas (ENGANCHE y A FIN = monto a arrendar).
function cotMonto_(c, lineas, colRes, colLinea){ const v = num_(c[colRes]); if(v) return v; if(!lineas.length) return null; return lineas.reduce((s, l)=> s + (num_(l[colLinea]) || 0), 0); }
function cotModelos_(lineas){ const m = Array.from(new Set(lineas.map(l=> pakModelo_(l.MARCA, String(l.MODELO || '').trim())).filter(x=> x && x !== 'BOLSA'))); return m.length === 0 ? (lineas.some(l=> String(l.MODELO).trim() === 'BOLSA') ? 'Bolsa' : 'Sin equipo') : m.length === 1 ? m[0] : `${m.length} modelos`; }
function cotMeses_(lineas){ const p = Array.from(new Set(lineas.map(l=> String(l.PL ?? '').trim()).filter(Boolean))); return p.length ? p.join('/') + ' m' : ''; }
function cotPintar_(){
  estadoCarga_('cotEstado', 'cot', cotFolios_().length, 'cotizaciones');
  const q = norm_(COT_Q);
  const lista = cotFolios_().filter(c=>{
    const f = c['FOLIO COTIZACIÓN'], st = cotEstado_(f);
    if(st && st.d) return false;
    if(CLI){ const k = norm_(c['CLIENTE']), cc = norm_(CLI['CLIENTE CORTO']), r = norm_(razonDe_(CLI)); if(!(k === cc || k === r || (r && k.includes(r)))) return false; }
    return !q || norm_(c['CLIENTE'] + ' ' + f + ' ' + (c['FOLIO TELCEL'] || '')).includes(q);
  }).sort((a, b)=> String(b['FOLIO COTIZACIÓN']).localeCompare(String(a['FOLIO COTIZACIÓN'])));
  lista.slice(0, 40).forEach(c=> cotCargarDetalle_(c['FOLIO COTIZACIÓN']));
  $('cotLista').innerHTML = lista.length ? lista.map(c=>{
    const f = c['FOLIO COTIZACIÓN'], st = cotEstado_(f), l = cotLineasV_(f);
    return `<div class="renglon toque" data-folio="${esc(f)}"><div class="riel" style="${st ? 'background:' + st.c : ''}"></div><div class="cuerpo">
      <div style="display:flex; justify-content:space-between; gap:8px; align-items:center;"><span style="font-size:15px; font-weight:600; color:var(--cyan)">${esc(c['CLIENTE'])}</span>${st ? `<span class="estatus" style="background:${st.c}; color:#fff">${st.t}</span>` : '<span class="k">…</span>'}</div>
      <div style="display:flex; justify-content:space-between; gap:8px; align-items:flex-end; margin-top:4px;">
        <span style="font-size:13px; color:var(--text-dim)">${esc(cotTipo_(l, c))}${l.length ? ' · ' + esc(cotModelos_(l)) : ''}${cotMeses_(l) ? ' · <span class="num">' + esc(cotMeses_(l)) + '</span>' : ''}</span>
        <span style="text-align:right; flex:0 0 auto"><span class="num" style="font-size:20px">${cotMonto_(c, l, 'PAGO INICIAL', 'ENGANCHE') === null ? '…' : esc(mon_(cotMonto_(c, l, 'PAGO INICIAL', 'ENGANCHE'), 0))}</span><span class="k" style="display:block">enganche</span></span>
      </div>
      <div style="display:flex; justify-content:space-between; gap:8px;"><span class="k">${esc(f)} · V${esc(c['VERSIÓN'] || 1)} · ${esc(fecha_(c['FECHA']))}</span><span class="k">Arrendar <span class="num" style="font-size:14px; color:var(--text-dim)">${cotMonto_(c, l, 'MONTO A ARRENDAR', 'A FIN') === null ? '…' : esc(mon_(cotMonto_(c, l, 'MONTO A ARRENDAR', 'A FIN'), 0))}</span></span></div>
    </div></div>`;
  }).join('') : '<div class="vacio-panel">Ninguna cotización coincide.</div>';
}
$('cotLista').addEventListener('click', e=>{ const r = e.target.closest('[data-folio]'); if(!r) return; COT_ABIERTO = r.dataset.folio; $('cotListaWrap').classList.add('hidden'); $('cotDetalle').classList.remove('hidden'); $('mMain').scrollTop = 0;
  navPush_({ deshacer: ()=>{ COT_ABIERTO = null; $('cotDetalle').classList.add('hidden'); $('cotListaWrap').classList.remove('hidden'); cotPintar_(); } });
  cotCargarDetalle_(COT_ABIERTO); cotPintarDetalle_(); });
function cotPintarDetalle_(){
  const f = COT_ABIERTO, c = cotFolios_().find(x=> x['FOLIO COTIZACIÓN'] === f); if(!c) return;
  const st = cotEstado_(f), l = cotLineasV_(f);
  $('cotDetTit').textContent = c['CLIENTE'];
  $('cotDetEst').innerHTML = st ? `<span class="estatus" style="background:${st.c}; color:#fff">${st.t}</span>` : '';
  const grupos = {};
  l.forEach(x=>{ const k = (x.MODELO || '') + '|' + (x.PLAN || '') + '|' + (x.TR || '') + '|' + (x.PL ?? ''); (grupos[k] = grupos[k] || []).push(x); });
  const trTxt = { N:'Nueva', M:'Migración', P:'Portabilidad', R:'Renovación' };
  $('cotDetCuerpo').innerHTML = `
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line);">
      <div><div class="k">Enganche total</div><div class="num grande">${esc(mon_(cotMonto_(c, l, 'PAGO INICIAL', 'ENGANCHE')))}</div></div>
      <div><div class="k">Monto a arrendar</div><div class="num grande">${esc(mon_(cotMonto_(c, l, 'MONTO A ARRENDAR', 'A FIN')))}</div></div>
      <div><div class="k">Renta mensual</div><div class="num grande">${esc(mon_(c['TOTAL MENSUAL RENTAS']))}</div></div>
      <div><div class="k">Pago mensual total</div><div class="num grande" style="color:var(--cyan)">${esc(mon_(c['PAGO MENSUAL RENTAS + ARRENDAMIENTO']))}</div></div>
    </div>
    <div class="k" style="padding:8px 14px 0">${esc(f)} · V${esc(c['VERSIÓN'] || 1)} · ${esc(fecha_(c['FECHA']))} · ${l.length || esc(c['CANTIDAD DE LÍNEAS'])} línea(s)${c['FOLIO TELCEL'] ? ' · Telcel ' + esc(c['FOLIO TELCEL']) : ''}</div>
    ${!COT_DET[f] ? '<div class="vacio-panel">Cargando líneas…</div>' : Object.values(grupos).map(g=>{ const x = g[0];
      return `<div class="renglon"><div class="riel"></div><div class="cuerpo">
        <div style="display:flex; justify-content:space-between;"><span style="font-size:15px; font-weight:600">${esc([x.MARCA, pakModelo_(x.MARCA, x.MODELO)].filter(Boolean).join(' ') || 'Sin equipo')}</span><span class="num" style="font-size:18px">×${g.length}</span></div>
        <div style="font-size:13px; color:var(--text-dim)">${esc(trTxt[String(x.TR || '').toUpperCase()] || x.TR || '')} · ${esc(x.PLAN || '—')} · <span class="num">${esc(mon_(x.RENTA))}</span> renta · <span class="num">${esc(x.PL ?? '—')}</span> m</div>
        <div class="num" style="font-size:13px; color:var(--text-faint)">Enganche ${esc(mon_(x.ENGANCHE))} · A financiar ${esc(mon_(x['A FIN']))} · ${esc(mon_(x.MENS))}/mes × ${esc(x['PL FIN'] || x.PL || '—')}</div>
        ${x['PRECIO NEGOCIACIÓN'] ? `<div class="num" style="font-size:13px; color:var(--text-faint)">Precio negociación ${esc(mon_(x['PRECIO NEGOCIACIÓN']))}</div>` : ''}
      </div></div>`; }).join('')}`;
}
$('cotInput').addEventListener('input', ()=>{ COT_Q = $('cotInput').value; cotPintar_(); });
sugerenciasCliente_('cotInput', 'cotSug', row=>{ clienteActivoSet_(row); COT_Q = ''; $('cotInput').value = ''; cotPintar_(); });
ENTRAR.cotizacion = ()=>{ cargar('cot'); cargar('trm'); if(COT_ABIERTO) cotPintarDetalle_(); else cotPintar_(); };
QUITAR_CLIENTE.cotizacion = ()=> cotPintar_();
alCargar_('cot', ()=>{ if(VISTA === 'cotizacion') cotRepintar_(); });

/* ============================================================================
   MASIVO (42.14): líneas de Master con MDO = M; mismos filtros que el escritorio
   ============================================================================ */
let MAS_Q = '', MAS_CLI = '', MAS_F = { plazo:null, marca:null };
function masPintar_(){
  estadoCarga_('masEstado', 'master', DATA.master.rows.length, 'líneas en Master');
  $('masFiltros').innerHTML = [['plazo', 'cumplido', 'Plazo cumplido'], ['plazo', 'pendiente', 'Plazo pendiente'], ['marca', 'iphone', 'iPhone'], ['marca', 'samsung', 'Samsung']]
    .map(([g, v, l])=> `<button type="button" class="chip${MAS_F[g] === v ? ' active' : ''}" data-g="${g}" data-v="${v}">${l}</button>`).join('');
  if(!DATA.master.rows.length){ $('masLista').innerHTML = '<div class="vacio-panel">Cargando líneas de Master…</div>'; return; }
  const q = MAS_Q.trim(), n = esNumerico_(q) ? normalizeSearch(q) : '';
  const lista = DATA.master.rows.filter(r=>{
    if(String(mv(r, 'MDO')).trim().toUpperCase() !== 'M' || String(mv(r, 'ET')).trim().toUpperCase() === 'C') return false;
    const mpr = String(mv(r, 'MPR')).trim().toUpperCase();
    if(MAS_F.plazo === 'cumplido' && !(mpr === 'L' || (mpr !== '' && Number(mpr) <= 3))) return false;
    if(MAS_F.plazo === 'pendiente' && !(mpr !== '' && mpr !== 'L' && Number(mpr) > 3)) return false;
    const mm = norm_(mv(r, 'MARCA') + ' ' + mv(r, 'MODELO'));
    if(MAS_F.marca === 'iphone' && !/IPHONE|APPLE/.test(mm)) return false;
    if(MAS_F.marca === 'samsung' && !/SAMSUNG/.test(mm)) return false;
    if(MAS_CLI) return mismoClienteTxt_(mv(r, 'CLIENTE'), MAS_CLI);
    if(n) return String(mv(r, 'NUMERO')).replace(/\D/g, '').includes(n) || String(mv(r, 'CUENTA')).replace(/\D/g, '').includes(n) || (n.length === 15 && String(mv(r, 'IMEI')).includes(n));
    if(q){ const pal = norm_(mv(r, 'CLIENTE')).split(/[^A-Z0-9Ñ&]+/).filter(Boolean); return norm_(q).split(/\s+/).every(p=> pal.some(w=> w.startsWith(p))); }
    return true;
  });
  $('masLista').innerHTML = `<div class="k" style="padding:6px 14px">${lista.length} línea(s)</div>` + (lista.length ? lista.slice(0, 300).map(r=>{
    const mpr = String(mv(r, 'MPR')).trim(), fin = String(mv(r, 'FIN')).trim();
    const meses = mpr !== '' ? mpr : (/LIBRE/i.test(fin) ? 'L' : (mesesHasta_(fin) ?? '—'));
    const cumplido = String(meses).toUpperCase() === 'L' || (!isNaN(Number(meses)) && Number(meses) <= 3);
    return `<div class="renglon"><div class="riel" style="${cumplido ? 'background:var(--green)' : ''}"></div><div class="cuerpo">
      <div style="display:flex; justify-content:space-between; align-items:baseline; gap:8px;"><span class="num copiable" data-copiar="${esc(String(mv(r, 'NUMERO')).replace(/\D/g, ''))}" style="font-size:21px">${esc(tel_(mv(r, 'NUMERO')))}</span><span class="num" style="font-size:21px; color:${cumplido ? 'var(--green)' : 'var(--cyan)'}">${esc(meses)}<span class="k" style="font-family:Barlow"> meses</span></span></div>
      <div style="font-size:13px; color:var(--text-dim)">${esc(mv(r, 'CLIENTE'))} · ${esc(mv(r, 'PLAN') || '—')} · <span class="num">${esc(mon_(mv(r, 'RENTA')))}</span></div>
      <div class="num" style="font-size:13px; color:var(--text-faint)">Cta ${esc(mv(r, 'CUENTA') || '—')} · ${esc(fecha_(mv(r, 'INICIO')))} → ${esc(fecha_(fin))}</div>
    </div></div>`;
  }).join('') + (lista.length > 300 ? `<div class="vacio-panel">Se muestran 300 de ${lista.length}; usa la búsqueda o un filtro.</div>` : '') : '<div class="vacio-panel">Ninguna línea coincide.</div>');
}
$('masFiltros').addEventListener('click', e=>{ const b = e.target.closest('[data-g]'); if(!b) return; MAS_F[b.dataset.g] = MAS_F[b.dataset.g] === b.dataset.v ? null : b.dataset.v; masPintar_(); });
$('masInput').addEventListener('input', ()=>{ MAS_Q = $('masInput').value; if(MAS_CLI && norm_(MAS_Q) !== norm_(MAS_CLI)) MAS_CLI = ''; masPintar_(); });
sugerenciasCliente_('masInput', 'masSug', row=>{ MAS_CLI = row['CLIENTE CORTO'] || razonDe_(row); $('masInput').value = MAS_CLI; MAS_Q = MAS_CLI; masPintar_(); });
ENTRAR.masivo = ()=>{ cargar('master'); masPintar_(); };
alCargar_('master', ()=>{ if(VISTA === 'masivo') masPintar_(); if(VISTA === 'dashboard' && DASH_TEL) dashPintar_(); });

/* ============================================================================
   Arranque: sesión (misma mecánica de siempre) y carga en segundo plano
   ============================================================================ */
document.querySelectorAll('[data-recargar]').forEach(b=> b.addEventListener('click', ()=>{
  const v = b.dataset.recargar;
  ({ adendum: ['adRes', 'adDet'], clientes: ['clientes'], tramites: ['trm', 'master'], tareas: ['tareas'], preciosak: ['pak', 'exist', 'run'], cotizacion: ['cot'], masivo: ['master'] }[v] || []).forEach(k=> cargar(k, true));
  if(v === 'cotizacion') Object.keys(COT_DET).forEach(k=> delete COT_DET[k]);
  notificar('Actualizando desde Google Sheets…', 'aviso');
}));
function currentSession(){ try{ const raw = localStorage.getItem(AUTH_STORAGE_KEY) || sessionStorage.getItem(AUTH_STORAGE_KEY); if(!raw) return null; const s = JSON.parse(raw); return (s && s.userKey && USERS_DB[s.userKey] && s.token && Number(s.exp) > Date.now()) ? s : null; /* 18OCTV6 (#10): con token vigente */ }catch(e){ return null; } }
function showApp(userKey){
  CURRENT_USER_KEY = userKey; CURRENT_ROLE = (USERS_DB[userKey] || {}).role || null;
  $('loginScreen').style.display = 'none'; $('appRoot').style.display = 'flex';
  $('mUserLabel').textContent = usuarioNombre_(); $('mVersion').textContent = PANEL_VERSION;
  try{ history.replaceState({ nexus: 0 }, ''); history.pushState({ nexus: 0 }, ''); }catch(e){}
  setTimeout(()=>{ ['clientes', 'tareas', 'adRes', 'trm', 'cot', 'tickets'].forEach(k=> cargar(k)); mostrarVista_('dashboard'); }, 0);
}
$('mLogoutBtn').addEventListener('click', ()=>{ localStorage.removeItem(AUTH_STORAGE_KEY); sessionStorage.removeItem(AUTH_STORAGE_KEY); location.reload(); });
// 18OCTV6 (#10): la contraseña la valida Apps Script y regresa el token (30 días en este equipo).
$('loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const u = $('loginUser').value, p = $('loginPass').value, rec = $('loginRemember').checked;
  const btn = $('loginForm').querySelector('button[type="submit"], .login-submit');
  if(btn){ btn.disabled = true; }
  try{
    if(!USERS_DB[u]) throw new Error('Usuario o contraseña incorrectos.');
    const r = await nexusLoginServidor_(u, p);
    const pl = JSON.stringify({ userKey: u, ts: Date.now(), token: r.token, exp: r.exp });
    if(rec){ localStorage.setItem(AUTH_STORAGE_KEY, pl); try{ sessionStorage.setItem(AUTH_STORAGE_KEY, pl); }catch(e2){} } else { try{ localStorage.removeItem(AUTH_STORAGE_KEY); }catch(e2){} sessionStorage.setItem(AUTH_STORAGE_KEY, pl); }   // 07NOVV1 (#182)
    // 07NOVV1 (#182): si la sesión se cerró con el panel abierto (mismo usuario), se sigue sin recargar
    if(CURRENT_USER_KEY && u === CURRENT_USER_KEY && $('appRoot').style.display !== 'none'){ $('loginScreen').style.display = 'none'; $('loginPass').value = ''; nexusSesionAvisada_ = false; notificar('Sesión renovada. Si lo último no se guardó, repítelo.', 'ok'); return; }
    location.reload();   // recarga: todas las lecturas del panel salen ya con el token
  }catch(err){
    $('loginError').style.display = 'block'; $('loginError').textContent = err.message; $('loginPass').value = '';
  }finally{ if(btn) btn.disabled = false; }
});
document.querySelector('.login-card img').src = document.querySelector('.m-header img').src;
(function(){ const s = currentSession(); if(s) showApp(s.userKey); else $('loginScreen').style.display = 'flex'; })();
console.log('%cNEXUS Móvil — versión ' + PANEL_VERSION, 'font-weight:bold; color:#4FC3F7;');
</script>
