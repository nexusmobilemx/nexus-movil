<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1630">
<title>NEXUS Móvil</title>
<!-- 22OCTV3-MOVIL (2026-10-22, a petición de César, #68): instalable como app desde Chrome (GitHub Pages) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<!-- 12OCTV1-MOVIL (2026-10-12, a petición de César): panel móvil V2. Rediseño con el estilo del Panel Master (azul tinta,
     azul marino, cian solo para lo activo; letra Barlow y Barlow Condensed de ancho fijo para números) y vistas nuevas:
     Dashboard, Trámites, Cotización y Masivo, además de Adendum, Clientes, Tareas y Precios AK puestos al día con el
     escritorio. Ver Cola_por_construir.md punto 42 (42.1 a 42.16). -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap');
  :root{
    --ink:#0A1630; --navy:#123A6E; --surface:#0F2142; --line:#1F3358; --line-soft:#1A2B4A;
    --text:#E8EEF8; --text-dim:#C9D6EA; --text-faint:#8FA3C4; --cyan:#4FC3F7; --cyan-soft:#7FE0FF;
    --green:#4FD1A5; --amber:#E0A857; --red:#E85D6B; --orange:#FF8C00; --violet:#A78BFA;
    --st-pendiente:#FF5F1F; --st-proceso:#2F80ED; --st-espera:#64748B; --st-completada:#10B981; --st-cancelada:#F43F5E;
    --safe-top:env(safe-area-inset-top, 0px); --safe-bottom:env(safe-area-inset-bottom, 0px);
    --header-h:56px; --nav-h:112px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--ink); color:var(--text); font-family:'Barlow',system-ui,sans-serif; font-size:15px; -webkit-font-smoothing:antialiased; overscroll-behavior:none; }
  button,input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  :focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
  .num{ font-family:'Barlow Condensed','Barlow',sans-serif; font-variant-numeric:tabular-nums; letter-spacing:.02em; }
  .k{ font-size:12px; color:var(--text-faint); }
  .vacio{ color:var(--text-faint); }
  .hidden{ display:none !important; }

  /* ===== Login ===== */
  .login-screen{ display:none; position:fixed; inset:0; z-index:9999; align-items:center; justify-content:center; padding:20px; background:var(--ink); }
  .login-card{ width:100%; max-width:360px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:24px 20px; }
  .login-card img{ height:34px; display:block; margin:0 auto 16px; }
  .login-card h2{ margin:0 0 4px; font-size:18px; font-weight:600; text-align:center; }
  .login-sub{ margin:0 0 16px; font-size:13px; color:var(--text-faint); text-align:center; }
  .login-field{ margin-bottom:12px; }
  .login-field label{ display:block; font-size:12px; color:var(--text-faint); margin-bottom:4px; }
  .login-field select, .login-field input{ width:100%; height:44px; border-radius:10px; border:1px solid var(--line); background:var(--ink); padding:0 12px; }
  .login-remember{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-dim); margin:4px 0 16px; }
  .login-submit{ width:100%; height:46px; border:none; border-radius:10px; background:var(--cyan); color:#08111F; font-weight:600; font-size:16px; }
  .login-error{ display:none; color:var(--red); font-size:13px; margin-bottom:10px; text-align:center; }

  /* ===== Estructura ===== */
  #appRoot{ display:none; flex-direction:column; height:100%; }
  .m-header{ position:fixed; top:0; left:0; right:0; z-index:50; height:calc(var(--header-h) + var(--safe-top)); padding:var(--safe-top) 12px 0 14px; display:flex; align-items:center; gap:10px; background:var(--ink); border-bottom:1px solid var(--line); }
  .m-header img{ height:22px; flex:0 0 auto; }
  .m-header .vista{ font-size:14px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cli-chip{ display:inline-flex; align-items:center; gap:4px; max-width:46vw; padding:4px 4px 4px 10px; border-radius:99px; background:var(--navy); border:1px solid var(--cyan); color:var(--cyan-soft); font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; }
  .cli-chip span{ overflow:hidden; text-overflow:ellipsis; }
  .cli-chip button{ width:22px; height:22px; border-radius:99px; border:none; background:rgba(255,255,255,0.14); color:#fff; font-size:11px; flex:0 0 auto; }
  .btn-tarea{ margin-left:auto; flex:0 0 auto; height:36px; padding:0 12px; border-radius:10px; border:none; background:var(--cyan); color:#08111F; font-weight:600; font-size:14px; display:flex; align-items:center; gap:4px; }
  .m-main{ flex:1; overflow-y:auto; padding:calc(var(--header-h) + var(--safe-top)) 0 calc(var(--nav-h) + var(--safe-bottom) + 8px); -webkit-overflow-scrolling:touch; }
  .m-screen{ display:none; }
  .m-screen.active{ display:block; }
  .barra{ padding:12px 14px 8px; position:sticky; top:0; z-index:20; background:var(--ink); }
  .buscador{ position:relative; }
  .buscador .caja{ display:flex; align-items:center; gap:8px; height:44px; padding:0 10px; background:var(--surface); border:1px solid var(--line); border-radius:10px; }
  .buscador .caja:focus-within{ border-color:var(--cyan); }
  .buscador svg{ width:18px; height:18px; stroke:var(--text-faint); fill:none; stroke-width:2; flex:0 0 auto; }
  .buscador input{ flex:1; min-width:0; height:100%; border:none; background:transparent; outline:none; font-size:16px; }
  .buscador .limpiar{ width:30px; height:30px; border:none; border-radius:99px; background:transparent; color:var(--text-faint); font-size:15px; }
  .sug{ position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:40; max-height:40vh; overflow-y:auto; background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:0 10px 24px rgba(0,0,0,0.45); display:none; }
  .sug.open{ display:block; }
  .sug button{ display:block; width:100%; text-align:left; padding:10px 12px; border:none; border-bottom:1px solid var(--line-soft); background:transparent; }
  .sug button:last-child{ border-bottom:none; }
  .sug .r{ font-size:14px; font-weight:600; }
  .sug .m{ font-size:12px; color:var(--text-faint); }
  .chips{ display:flex; gap:6px; overflow-x:auto; padding:8px 0 2px; scrollbar-width:none; }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{ flex:0 0 auto; height:34px; padding:0 12px; border-radius:99px; border:1px solid var(--line); background:transparent; color:var(--text-dim); font-size:13px; white-space:nowrap; }
  .chip.active{ background:var(--cyan); border-color:var(--cyan); color:#08111F; font-weight:600; }
  .chip .c{ font-family:'Barlow Condensed',sans-serif; margin-left:4px; opacity:.85; }
  .estado-linea{ display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--text-faint); padding:6px 0 0; gap:8px; }
  .estado-linea button{ border:none; background:transparent; color:var(--cyan); font-size:13px; padding:4px 0; }
  .vacio-panel{ padding:40px 24px; text-align:center; color:var(--text-faint); font-size:14px; line-height:1.5; }

  /* ===== Barra inferior: 2 renglones de 4 (estilo del menú de Panel Master) ===== */
  .m-nav{ position:fixed; left:0; right:0; bottom:0; z-index:50; padding:6px 6px calc(6px + var(--safe-bottom)); background:var(--ink); border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(4, 1fr); gap:4px; }
  .m-nav button{ height:46px; border:1px solid transparent; border-radius:10px; background:transparent; color:var(--text-faint); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:11px; font-weight:600; letter-spacing:.02em; }
  .m-nav svg{ width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .m-nav button.active{ background:#FFD45A; color:#1A1400; }
  .m-nav button .badge{ position:absolute; }

  /* ===== Tarjetas, renglones y secciones ===== */
  .tarjeta{ margin:8px 14px; padding:12px 14px; border-radius:12px; background:var(--surface); border:1px solid var(--line); }
  .renglon{ display:grid; grid-template-columns:4px 1fr; border-bottom:1px solid var(--line-soft); }
  .renglon .riel{ background:#2B4A7A; }
  .renglon .cuerpo{ padding:10px 14px 10px 12px; min-width:0; }
  .renglon.toque{ cursor:pointer; }
  .renglon.toque:active{ background:rgba(79,195,247,0.06); }
  .sec{ padding:12px 14px; border-bottom:1px solid var(--line-soft); }
  .sec-t{ font-size:13px; color:var(--cyan-soft); font-weight:600; margin-bottom:6px; }
  .par{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:5px 0; }
  .par > div{ min-width:0; }
  .v{ font-size:15px; word-break:break-word; }
  .redondo{ width:36px; height:36px; border-radius:99px; border:1px solid #2B4A7A; background:transparent; color:var(--cyan); display:flex; align-items:center; justify-content:center; flex:0 0 auto; text-decoration:none; }
  .redondo svg{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; }
  .plegable > summary{ list-style:none; display:flex; justify-content:space-between; align-items:center; padding:14px; font-size:15px; color:var(--text-dim); border-bottom:1px solid var(--line-soft); cursor:pointer; }
  .plegable > summary::-webkit-details-marker{ display:none; }
  .plegable[open] > summary .flecha{ transform:rotate(180deg); }
  .btn-prim{ width:100%; height:46px; border:none; border-radius:10px; background:var(--cyan); color:#08111F; font-weight:600; font-size:15px; }
  .btn-sec{ height:40px; padding:0 14px; border-radius:10px; border:1px solid #2B4A7A; background:transparent; color:var(--text-dim); font-size:14px; }
  .atras{ display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line); background:var(--ink); position:sticky; top:0; z-index:20; }
  .atras button{ width:36px; height:36px; border:none; background:transparent; color:var(--text); display:flex; align-items:center; justify-content:center; }
  .atras svg{ width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2; }
  .atras .t{ font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .faltan{ display:inline-block; padding:3px 10px; border-radius:99px; background:#FFB020; color:#1F1300; font-size:12px; font-weight:600; }
  .estatus{ display:inline-block; padding:3px 10px; border-radius:99px; font-size:12px; font-weight:600; white-space:nowrap; }
  /* 04NOVV1-MOVIL (#162 fases 0–1, #166): pasos del trámite, nota y Mis pendientes */
  .pasos-lista{ padding:4px 14px 8px; }
  .pasos-cab{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin:12px 0 4px; font-weight:600; }
  .paso{ display:grid; grid-template-columns:24px 1fr auto; gap:8px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line-soft); }
  .paso .ic{ width:22px; height:22px; border-radius:99px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; border:1px solid var(--line); color:var(--text-faint); }
  .paso.hecho .ic{ background:var(--green); border-color:var(--green); color:#08111F; }
  .paso.sig .ic{ background:var(--amber); border-color:var(--amber); color:#08111F; }
  .paso.na .ic{ background:var(--line); color:var(--text-faint); }
  .paso .nom{ font-size:14px; font-weight:600; }
  .paso.hecho .nom{ color:var(--text-dim); }
  .paso .meta{ font-size:12px; color:var(--text-faint); margin-top:2px; overflow-wrap:anywhere; }
  .paso button{ height:36px; padding:0 12px; border-radius:10px; font-size:13px; font-weight:600; }
  .paso button.marcar{ border:none; background:var(--cyan); color:#08111F; }
  .paso button.desmarcar{ border:1px solid #2B4A7A; background:transparent; color:var(--text-dim); }
  .tp-aviso{ font-size:13px; color:var(--amber); margin:4px 0 12px; white-space:pre-line; }
  .tp-aviso.error{ color:var(--red); }
  .hist{ white-space:pre-line; font-size:12px; color:var(--text-dim); line-height:1.45; padding:4px 0; }
  .pend-captura{ display:flex; gap:8px; }
  .pend-captura input{ flex:1; height:44px; border-radius:10px; border:1px solid var(--line); background:var(--surface); padding:0 12px; }
  .pend-comp{ flex:0 0 auto; height:44px; padding:0 10px; border-radius:10px; border:1px solid #2B4A7A; background:transparent; color:var(--text-faint); font-size:12px; font-weight:700; letter-spacing:.04em; }
  .pend-comp.on{ background:var(--amber); border-color:var(--amber); color:#08111F; }
  .pend{ display:grid; grid-template-columns:28px 1fr auto; gap:8px; align-items:start; padding:12px 0; border-bottom:1px solid var(--line-soft); }
  .pend input[type=checkbox]{ width:22px; height:22px; margin-top:2px; }
  .pend.hecha .t{ text-decoration:line-through; color:var(--text-faint); }
  .pend .tag{ display:inline-block; margin-left:6px; padding:0 6px; border-radius:99px; font-size:10px; font-weight:700; background:rgba(224,168,87,0.16); color:var(--amber); }
  .pend .acc{ display:flex; gap:6px; }
  .pend .acc button{ height:32px; padding:0 8px; border-radius:8px; border:1px solid #2B4A7A; background:transparent; color:var(--text-faint); font-size:12px; }
  /* 04NOVV3-MOVIL (#162 fase 2): Qué hago ahora, correos, responsable */
  .tab-cas{ display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-top:10px; }
  .tab-cas button{ display:flex; flex-direction:column; align-items:flex-start; gap:2px; padding:8px; border-radius:10px; border:1px solid var(--line); border-left:3px solid var(--c); background:var(--surface); text-align:left; }
  .tab-cas button b{ font-size:22px; line-height:1; }
  .tab-cas button span{ font-size:11px; color:var(--text-faint); }
  .tab-cas button.on{ border-color:var(--c); }
  .tab-fil{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .tab-fil button{ height:32px; padding:0 12px; border-radius:99px; border:1px solid var(--line); background:transparent; color:var(--text-dim); font-size:13px; }
  .tab-fil button.on{ background:var(--cyan); border-color:var(--cyan); color:#08111F; font-weight:600; }
  .correo{ padding:12px 0; border-bottom:1px solid var(--line-soft); }
  .correo-acc{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
  .correo-acc .btn-prim{ width:auto; height:40px; padding:0 16px; margin:0; }
  .resp-sel{ width:100%; height:44px; margin-top:6px; border-radius:10px; border:1px solid var(--line); background:var(--surface); padding:0 12px; font-size:15px; }
  .grande{ font-size:22px; line-height:1.1; }
  .mega{ font-size:34px; line-height:1.05; }
  .avance{ height:4px; border-radius:99px; background:var(--line); overflow:hidden; margin-top:6px; }
  .avance > i{ display:block; height:100%; background:var(--cyan); }

  /* ===== Tareas (diseño de tarjetas conservado) ===== */
  .tarea-card{ margin:8px 14px; padding:12px 14px; border-radius:12px; background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--line); }
  .tarea-card .tg-top{ display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
  .tarea-card .tg-cli{ font-size:15px; font-weight:600; color:var(--cyan); line-height:1.25; }
  .tarea-card .tg-tit{ font-size:15px; font-weight:600; margin-top:4px; }
  .tarea-card .tg-ult{ font-size:13px; color:rgba(255,255,255,0.75); margin-top:6px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .tarea-card .tg-meta{ display:flex; justify-content:space-between; margin-top:8px; font-size:12px; color:var(--text-faint); }
  .vencida{ color:var(--red); font-weight:600; } .pronto{ color:var(--amber); font-weight:600; }
  .est-pendiente{ background:var(--st-pendiente); color:#2A1400; } .est-proceso{ background:var(--st-proceso); color:#fff; } .est-en_espera{ background:var(--st-espera); color:#fff; } .est-completada{ background:var(--st-completada); color:#04241A; } .est-cancelada{ background:var(--st-cancelada); color:#fff; }
  .borde-pendiente{ border-left-color:var(--st-pendiente); } .borde-proceso{ border-left-color:var(--st-proceso); } .borde-en_espera{ border-left-color:var(--st-espera); } .borde-completada{ border-left-color:var(--st-completada); } .borde-cancelada{ border-left-color:var(--st-cancelada); }

  /* ===== Ventanas (pantalla completa) ===== */
  .ov{ position:fixed; inset:0; z-index:80; background:var(--ink); display:none; flex-direction:column; }
  .ov.open{ display:flex; }
  .ov .ov-cuerpo{ flex:1; overflow-y:auto; padding:12px 14px calc(16px + var(--safe-bottom)); }
  .campo{ margin-bottom:12px; }
  .campo label{ display:block; font-size:12px; color:var(--text-faint); margin-bottom:4px; }
  .campo input, .campo select, .campo textarea{ width:100%; min-height:44px; border-radius:10px; border:1px solid var(--line); background:var(--surface); padding:10px 12px; font-size:16px; }
  .campo textarea{ resize:vertical; }
  .campo input:focus, .campo select:focus, .campo textarea:focus{ border-color:var(--cyan); outline:none; }
  .mayus{ text-transform:uppercase; }
  .estados-btns{ display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-bottom:12px; }
  .estados-btns button{ height:38px; border-radius:99px; border:1px solid var(--line); background:transparent; color:var(--text-dim); font-size:13px; }
  .bitacora{ display:flex; flex-direction:column; gap:8px; margin-top:8px; }
  .bitacora div{ font-size:13px; color:rgba(255,255,255,0.75); line-height:1.4; }
  .bitacora b{ color:var(--text-faint); font-weight:500; }

  /* ===== Avisos ===== */
  .toasts{ position:fixed; left:12px; right:12px; bottom:calc(var(--nav-h) + var(--safe-bottom) + 10px); z-index:200; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
  .toast{ pointer-events:auto; padding:10px 14px; border-radius:10px; font-size:14px; line-height:1.4; background:var(--navy); border:1px solid var(--line); box-shadow:0 10px 24px rgba(0,0,0,0.45); }
  .toast.ok{ border-color:var(--green); } .toast.aviso{ border-color:var(--amber); } .toast.error{ border-color:var(--red); }
</style>
</head>
<body>


<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <img src="" alt="NEXUS">
    <h2>Acceso</h2>
    <p class="login-sub">Elige tu usuario y escribe tu contraseña.</p>
    <div id="loginError" class="login-error"></div>
    <form id="loginForm">
      <div class="login-field">
        <label for="loginUser">Usuario</label>
        <select id="loginUser">
          <option value="cesar">César Balderas</option>
          <option value="lucero">Lucero Hernández</option>
        </select>
      </div>
      <div class="login-field">
        <label for="loginPass">Contraseña</label>
        <input type="password" id="loginPass" autocomplete="current-password">
      </div>
      <label class="login-remember"><input type="checkbox" id="loginRemember" checked> Recordar sesión en este teléfono</label>
      <button type="submit" class="login-submit">Entrar</button>
    </form>
  </div>
</div>

<script>
/* ============================================================================
   NEXUS MÓVIL V2 (12OCTV1-MOVIL, 2026-10-12, a petición de César)

const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzO2ZqealB97NbwO1AHLrHrITtFzFAed7PbbgcPu-48ASOjykSsCvdxsjoWrUbdpfxX/exec';
/* 18OCTV6 (2026-10-18, a petición de César, auditoría #10 / F01): sesión con token del servidor. Las contraseñas ya no viven
   en este archivo: el login las manda a Apps Script (acción login), que regresa un token firmado válido 30 días en este equipo
   (P27). Cada llamada al Apps Script lleva el token (POST: campo token; GET: parámetro token). Si el servidor responde que la
   sesión ya no es válida (venció, se cambió la contraseña o la protección completa está activa sin token), se pide entrar de nuevo. */
const NEXUS_EQUIPO_KEY_ = 'nexus_equipo_id';
function nexusEquipo_(){
  let id = '';
  try{
    id = localStorage.getItem(NEXUS_EQUIPO_KEY_) || '';
    if(!id){ id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2)); localStorage.setItem(NEXUS_EQUIPO_KEY_, id); }
  }catch(e){}
  return id;
}
function nexusSesionToken_(){ try{ const s = currentSession(); return s && s.token ? s.token : ''; }catch(e){ return ''; } }
async function nexusLoginServidor_(userKey, password){
  let r = null;
  try{
    r = await fetch(APPS_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'login', usuario: userKey, password, equipo: nexusEquipo_() }) }).then(x=> x.json());
  }catch(err){ throw new Error('No hay conexión con Google Sheets. Revisa tu internet e intenta de nuevo.'); }
  if(r && /no reconocida/i.test(r.error || '')) throw new Error('Falta pegar Seguridad.gs y Codigo.gs en Apps Script (Nueva versión).');
  if(!r || r.ok !== true || !r.token) throw new Error((r && r.error) || 'El servidor no respondió.');
  return r;
}
/* 07NOVV1 (2026-11-07, a petición de César, #182): «me ha sacado de la sesión constantemente en escritorio y móvil». Antes, UNA respuesta
   «SESION…» del servidor borraba la sesión y recargaba la página a los 2.5 s (se perdía lo que estuviera en pantalla). Ahora:
   (1) se confirma con una llamada ligera «ping» después de 1.5 s; si el servidor la acepta, fue un rechazo pasajero y no pasa nada;
   (2) si de verdad venció, la pantalla de acceso sale ENCIMA del panel, sin recargar ni borrar lo que hay; al entrar se sigue trabajando
       (repetir la última acción si no se guardó); (3) las respuestas «transitorio» (servidor ocupado) se reintentan solas, 2 veces. */
let nexusSesionAvisada_ = false, nexusSesionRevisando_ = false;
async function nexusSesionVencida_(motivo){
  if(nexusSesionAvisada_ || nexusSesionRevisando_ || !nexusSesionToken_()) return;   // sin sesión (pantalla de login) no hay nada que cerrar
  nexusSesionRevisando_ = true;
  try{
    await new Promise(r=> setTimeout(r, 1500));
    let j = null;
    try{ j = await window.fetch(APPS_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action:'ping', __sinRevisar: true }) }).then(x=> x.json()); }catch(e){ return; }   // sin internet: no se cierra nada
    if(!(j && j.auth === false && /SESION/.test(j.error || ''))) return;   // el servidor sí acepta la sesión: fue pasajero
    motivo = j.error || motivo || '';
  } finally { nexusSesionRevisando_ = false; }
  nexusSesionAvisada_ = true;
  const m = /\(([^)]+)\)/.exec(motivo || '');
  const err = document.getElementById('loginError');
  if(err){ err.style.display = 'block'; err.textContent = 'Tu sesión se cerró' + (m ? ' (' + m[1] + ')' : '') + '. Vuelve a entrar: lo que tienes abierto se queda como está.'; }
  const sel = document.getElementById('loginUser'); if(sel && CURRENT_USER_KEY) sel.value = CURRENT_USER_KEY;
  document.getElementById('loginScreen').style.display = 'flex';
  setTimeout(()=>{ const p = document.getElementById('loginPass'); if(p) p.focus(); }, 50);
}
// Renovación deslizante: si al token le quedan menos de 20 días, el servidor da uno nuevo de 30 (se guarda donde estaba).
async function nexusSesionRenovar_(){
  const s = currentSession(); if(!s || Number(s.exp) - Date.now() > 20 * 86400000) return;
  try{
    const j = await fetch(APPS_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action:'renovarToken' }) }).then(x=> x.json());
    if(!j || j.ok !== true || !j.token) return;
    const payload = JSON.stringify({ userKey: s.userKey, ts: Date.now(), token: j.token, exp: j.exp });
    try{ if(localStorage.getItem(AUTH_STORAGE_KEY)) localStorage.setItem(AUTH_STORAGE_KEY, payload); sessionStorage.setItem(AUTH_STORAGE_KEY, payload); }catch(e){}
  }catch(e){}
}
setTimeout(()=>{ if(nexusSesionToken_()) nexusSesionRenovar_(); }, 20000);
(function(){
  const f0 = window.fetch.bind(window);
  window.fetch = function(u, o){
    let url = String(u);
    const alServidor = url.indexOf(APPS_SCRIPT_URL) === 0;
    let sinRevisar = false;
    try{
      const tk = alServidor ? nexusSesionToken_() : '';
      if(o && typeof o.body === 'string' && o.body.indexOf('"__sinRevisar":true') !== -1){ sinRevisar = true; o = Object.assign({}, o, { body: o.body.replace(',"__sinRevisar":true', '').replace('"__sinRevisar":true,', '').replace('"__sinRevisar":true', '') }); }
      if(tk){
        if(o && String(o.method || '').toUpperCase() === 'POST' && typeof o.body === 'string'){
          const b = JSON.parse(o.body);
          if(b && typeof b === 'object' && !Array.isArray(b) && !b.token && b.action !== 'login'){ b.token = tk; o = Object.assign({}, o, { body: JSON.stringify(b) }); }
        } else if(!/[?&]token=/.test(url)){
          url += (url.indexOf('?') === -1 ? '?' : '&') + 'token=' + encodeURIComponent(tk);
          u = url;
        }
      }
    }catch(e){}
    if(!alServidor) return f0(u, o);
    // #182: «servidor ocupado» (transitorio) se reintenta solo, 2 veces con espera; nunca cierra la sesión
    const intentar = async (n)=>{
      const resp = await f0(u, o);
      let j = null; try{ j = await resp.clone().json(); }catch(e){}
      if(j && j.transitorio && n < 2){ await new Promise(r=> setTimeout(r, 1200 * (n + 1))); return intentar(n + 1); }
      if(!sinRevisar && j && j.auth === false && /SESION/.test(j.error || '')) nexusSesionVencida_(j.error);
      return resp;
    };
    return intentar(0);
  };
})();
const PANEL_VERSION = '07NOVV1-MOVIL';   // 07NOVV1-MOVIL (2026-11-07, #182): la sesión ya no se cierra por un rechazo pasajero; volver a entrar sin recargar · 06NOVV3-MOVIL: salir de Pendientes ya no pregunta «¿Descartar lo capturado?» · 06NOVV1-MOVIL (2026-11-06, #176): correos de Telcel solo por número de trámite · 04NOVV2-MOVIL (#162 fase 2): «Qué hago ahora», correos de Telcel y responsable del trámite · 04NOVV1-MOVIL (2026-11-04, #162 fases 0–1 y #166): pasos del trámite con las reglas del escritorio, sin estatus libre, nota e historial; Mis pendientes en el Dashboard · 22OCTV3-MOVIL (2026-10-22): instalable como app (#68) ·   // 22OCTV2-MOVIL (2026-10-22): CONTRATO FIRMADO también en renovaciones (#62) · 21OCTV8-MOVIL: + estatus ACTIVACION ENVIADA (#40) · 21OCTV2-MOVIL: estatus nuevos de trámites (#26) · 13OCTV1-MOVIL: Precios AK con el inventario RUNNING
const AUTH_STORAGE_KEY = 'nexus_auth_session_movil_v1';
const USERS_DB = {

/* ---------- utilidades ---------- */
const $ = id=> document.getElementById(id);
const esc = s=> String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function norm_(s){ return String(s == null ? '' : s).toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim(); }
function num_(v){ const s = String(v == null ? '' : v).replace(/[$,\s]/g, ''); if(s === '' || s === '-') return null; const n = Number(s); return isNaN(n) ? null : n; }
function mon_(v, dec){ const n = num_(v); if(n === null) return '—'; return '$' + n.toLocaleString('es-MX', { minimumFractionDigits: dec === 0 ? 0 : 2, maximumFractionDigits: dec === 0 ? 0 : 2 }); }
function tel_(v){ const d = String(v == null ? '' : v).replace(/\D/g, ''); return d.length === 10 ? d.slice(0, 3) + ' ' + d.slice(3, 6) + ' ' + d.slice(6) : (d || '—'); }
function fecha_(v){
  const s = String(v == null ? '' : v).trim();
  if(!s) return '—';
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[3]}/${m[2]}/${m[1]}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m) return `${m[1].padStart(2, '0')}/${m[2].padStart(2, '0')}/${m[3]}`;
  return s;
}
function fechaObj_(v){
  if(v == null || v === '') return null;
  if(typeof v === 'number' && isFinite(v)) return new Date(Math.round((v - 25569) * 86400000));
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m) return new Date(+m[3], +m[2] - 1, +m[1]);
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return new Date(+m[1], +m[2] - 1, +m[3]);
  return null;
}
function mesesHasta_(fin){
  const f = fechaObj_(fin); if(!f) return null;
  const hoy = new Date();
  let m = (f.getFullYear() - hoy.getFullYear()) * 12 + (f.getMonth() - hoy.getMonth());
  if(f.getDate() < hoy.getDate()) m--;
  return m;
}
function notificar(msg, tipo){

// Búsqueda con números: mismas reglas que Master del escritorio (normalizeSearch): sin espacios, guiones, signos ni código
// de país; 10 dígitos = teléfono (últimos 10), 15 = IMEI y 18-20 = ICCID completos.
function normalizeSearch(text){
  const trimmed = String(text || '').trim();
  const digitsOnly = trimmed.replace(/[^0-9]/g, '');
  const isNumericish = digitsOnly.length >= Math.max(3, trimmed.replace(/\s/g, '').length * 0.7);
  if(!isNumericish) return trimmed;
  if(digitsOnly.length === 15 || (digitsOnly.length >= 18 && digitsOnly.length <= 20)) return digitsOnly;
  return digitsOnly.length > 10 ? digitsOnly.slice(-10) : digitsOnly;
}
const esNumerico_ = q=> /^\d+$/.test(normalizeSearch(q)) && normalizeSearch(q).length >= 3;
function abrirEnlace_(url){ const a = document.createElement('a'); a.href = url; a.target = '_top'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); }

/* ---------- caché (IndexedDB; si no hay, localStorage) ---------- */
const IDB = { db:null };
function idbAbrir_(){
  if(IDB.db) return Promise.resolve(IDB.db);
  return new Promise(res=>{
    try{
      const r = indexedDB.open('nexus_movil_v2', 1);
      r.onupgradeneeded = ()=> r.result.createObjectStore('c');
      r.onsuccess = ()=>{ IDB.db = r.result; res(IDB.db); };
      r.onerror = ()=> res(null);
    }catch(e){ res(null); }
  });
}
async function cacheGet(k){
  const db = await idbAbrir_();
  if(!db){ try{ return JSON.parse(localStorage.getItem('nexusMovil2_' + k) || 'null'); }catch(e){ return null; } }
  return new Promise(res=>{ try{ const q = db.transaction('c').objectStore('c').get(k); q.onsuccess = ()=> res(q.result || null); q.onerror = ()=> res(null); }catch(e){ res(null); } });
}
async function cacheSet(k, v){
  const db = await idbAbrir_();
  if(!db){ try{ localStorage.setItem('nexusMovil2_' + k, JSON.stringify(v)); }catch(e){} return; }
  try{ db.transaction('c', 'readwrite').objectStore('c').put(v, k); }catch(e){}
}

/* ---------- datos: copia guardada al instante + Sheets en segundo plano (42.7) ---------- */
const DATA = { clientes:[], tareas:[], master:{ headers:[], rows:[] }, adRes:[], adDet:[], pak:[], exist:[], run:[], cot:[], trm:[], act:[], tickets:[], correos:[] };

};
const ALCARGAR = {};   // clave -> [funciones a llamar al llegar datos]
function alCargar_(clave, fn){ (ALCARGAR[clave] = ALCARGAR[clave] || []).push(fn); }
async function cargar(clave, forzar){
  const f = FUENTES[clave];
  if(CARGADO[clave] === 'ok' && !forzar) return DATA[clave];
  if(!CARGADO[clave]){
    const c = await cacheGet(clave);
    if(c && !CARGADO[clave]){ DATA[clave] = c; if(clave === 'trm'){ const a = await cacheGet('act'); if(a) DATA.act = a; } CARGADO[clave] = 'cache'; (ALCARGAR[clave] || []).forEach(fn=> fn('cache')); }
  }
  try{
    const r = await fetch(APPS_SCRIPT_URL + '?action=' + f.url).then(x=> x.json());
    if(!r || r.error || r.ok === false) throw new Error((r && r.error) || 'sin respuesta');
    DATA[clave] = f.tomar(r);
    CARGADO[clave] = 'ok';
    cacheSet(clave, DATA[clave]);
    (ALCARGAR[clave] || []).forEach(fn=> fn('ok'));
  }catch(err){
    (ALCARGAR[clave] || []).forEach(fn=> fn('error', err));
  }
  return DATA[clave];
}
async function post_(cuerpo){
  const r = await fetch(APPS_SCRIPT_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(cuerpo) }).then(x=> x.json());
  if(!r || r.ok !== true) throw new Error((r && r.error) || 'El servidor no confirmó.');
  return r;
}
function estadoCarga_(el, clave, n, texto){
  const e = $(el); if(!e) return;
  e.textContent = CARGADO[clave] === 'ok' ? `${n} ${texto}` : CARGADO[clave] === 'cache' ? `${n} ${texto} (guardado) · actualizando…` : 'Conectando…';
}

/* ---------- Master: índice de columnas ---------- */
let MI = {};
alCargar_('master', ()=>{ MI = {}; DATA.master.headers.forEach((h, i)=> MI[String(h).trim()] = i); });
const mv = (row, col)=> MI[col] == null ? '' : (row[MI[col]] == null ? '' : row[MI[col]]);

/* ---------- Clientes: búsqueda igual que el escritorio (inicio de palabra o RFC) ---------- */
function cfVal(row, key){ if(!row) return ''; let v = row[key]; if((v == null || v === '') && key === 'RAZON SOCIAL') v = row['RAZÓN SOCIAL']; return v == null ? '' : String(v).trim(); }
function razonDe_(row){ return cfVal(row, 'RAZON SOCIAL') || cfVal(row, 'CLIENTE CORTO'); }
function buscarClientes(query){
  const q = norm_(query); if(!q) return [];
  const palabras = q.split(/[^A-Z0-9Ñ&]+/).filter(Boolean);
  const qRfc = q.replace(/\s+/g, '');
  const res = [];
  DATA.clientes.forEach(r=>{
    const razon = norm_(cfVal(r, 'RAZON SOCIAL')), corto = norm_(r['CLIENTE CORTO']), rfc = norm_(r['RFC']);
    const pal = (corto + ' ' + razon).split(/[^A-Z0-9Ñ&]+/).filter(Boolean);
    const porTexto = palabras.length && palabras.every(p=> pal.some(w=> w.startsWith(p)));
    const porRfc = qRfc.length >= 3 && rfc && rfc !== 'GENERICO' && rfc.includes(qRfc);
    if(!porTexto && !porRfc) return;
    res.push({ r, score: (corto === q || razon === q) ? 0 : (corto.startsWith(q) || razon.startsWith(q)) ? 1 : 2, corto });
  });
  return res.sort((a, b)=> a.score - b.score || a.corto.localeCompare(b.corto, 'es')).slice(0, 10).map(x=> x.r);
}
function clientePorCorto_(corto){ const k = norm_(corto); return DATA.clientes.find(r=> norm_(r['CLIENTE CORTO']) === k) || null; }
function clientePorRfc_(rfc){ const k = norm_(rfc); return k ? DATA.clientes.find(r=> norm_(r['RFC']) === k) || null : null; }
function clienteDeTexto_(txt){   // texto libre de Master / trámites: corto o razón social
  const k = norm_(txt); if(!k) return null;
  return DATA.clientes.find(r=> norm_(r['CLIENTE CORTO']) === k || norm_(cfVal(r, 'RAZON SOCIAL')) === k) || null;
}
function mismoCliente_(texto, row){
  const k = norm_(texto); if(!k || !row) return false;
  const c = norm_(row['CLIENTE CORTO']), r = norm_(cfVal(row, 'RAZON SOCIAL'));
  return k === c || k === r || (Math.min(k.length, c.length) >= 5 && (k.startsWith(c) || c.startsWith(k)));
}
alCargar_('clientes', ()=>{
  const dl = $('clientesCortos'); if(!dl) return;
  dl.innerHTML = DATA.clientes.map(r=> String(r['CLIENTE CORTO'] || '').trim()).filter(c=> c && c !== '-').map(c=> `<option value="${esc(c)}">`).join('');
});

/* Sugerencias: solo al ESCRIBIR (42.1); lista corta (máx. 10), nunca a pantalla completa. Con números no se sugieren
   clientes (se busca teléfono, cuenta, IMEI o ICCID). */
function sugerenciasCliente_(inputId, sugId, alElegir){
  const inp = $(inputId), sug = $(sugId);
  let lista = [];
  const cerrar = ()=>{ sug.classList.remove('open'); sug.innerHTML = ''; lista = []; };
  inp.addEventListener('input', ()=>{
    const q = inp.value;
    if(!q.trim() || esNumerico_(q)){ cerrar(); return; }
    lista = buscarClientes(q);
    if(!lista.length){ sug.innerHTML = '<div class="k" style="padding:10px 12px">Sin coincidencias en BD CLIENTES.</div>'; sug.classList.add('open'); return; }
    sug.innerHTML = lista.map((r, i)=> `<button type="button" data-i="${i}"><div class="r">${esc(razonDe_(r))}</div><div class="m">${esc(r['CLIENTE CORTO'] || '')}${r['RFC'] ? ' · ' + esc(r['RFC']) : ''}</div></button>`).join('');
    sug.classList.add('open');
  });
  sug.addEventListener('click', e=>{ const b = e.target.closest('button[data-i]'); if(!b) return; const r = lista[+b.dataset.i]; cerrar(); inp.blur(); alElegir(r); });
  inp.addEventListener('blur', ()=> setTimeout(cerrar, 200));
  inp.addEventListener('keydown', e=>{ if(e.key === 'Enter' && lista.length){ e.preventDefault(); const r = lista[0]; cerrar(); inp.blur(); alElegir(r); } });
}
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-limpiar]'); if(!b) return;
  const i = $(b.dataset.limpiar); i.value = ''; i.dispatchEvent(new Event('input', { bubbles:true }));
  if(b.dataset.limpiar !== 'adDetInput' && ['dashInput', 'tgInput', 'trmInput', 'cotInput', 'masInput', 'cliInput', 'adInput'].includes(b.dataset.limpiar)) clienteActivoQuitar_();
  i.focus();
});
</script>

<script>
/* ============================================================================
   Navegación, botón Atrás del teléfono (42.5) y cliente activo compartido (42.13)
   Cada vista, detalle o ventana que se abre se apila; el Atrás del teléfono (y las flechas ← / ✕ del panel) deshacen
   el último paso. En Dashboard sin nada abierto, el primer Atrás avisa y el segundo (en 2 s) sale.
   ============================================================================ */
const NAV = [];   // [{ deshacer: fn, ov: id? }]
let NAV_SALIR_T = 0, NAV_IGNORAR = 0;
function navPush_(paso){
  NAV.push(paso);
  try{ history.pushState({ nexus: NAV.length }, ''); }catch(e){}
}
function navAtras(){ try{ history.back(); }catch(e){ navPop_(); } }
function navPop_(){
  const paso = NAV.pop();
  if(!paso){
    if(Date.now() - NAV_SALIR_T < 2000){ try{ history.back(); }catch(e){} return false; }   // segundo Atrás: se deja salir
    NAV_SALIR_T = Date.now();
    notificar('Presiona Atrás otra vez para salir.', 'aviso');
    try{ history.pushState({ nexus: 0 }, ''); }catch(e){}
    return true;
  }
  if(paso.ov){
    const ov = $(paso.ov);
    if(ov && ov.dataset.sucio && !confirm('¿Descartar lo capturado?')){ NAV.push(paso); try{ history.pushState({ nexus: NAV.length }, ''); }catch(e){} return true; }
  }
  paso.deshacer();
  return true;
}
window.addEventListener('popstate', ()=>{
  if(NAV_IGNORAR){ NAV_IGNORAR--; return; }
  navPop_();
});
document.addEventListener('click', e=>{ if(e.target.closest('[data-atras]')){ e.preventDefault(); navAtras(); } });
// Ventanas a pantalla completa
function abrirOv_(id){
  const ov = $(id);
  delete ov.dataset.sucio;
  ov.classList.add('open');
  navPush_({ ov:id, deshacer: ()=>{ ov.classList.remove('open'); delete ov.dataset.sucio; } });
}
function cerrarOv_(id){
  const ov = $(id);
  if(!ov.classList.contains('open')) return;
  delete ov.dataset.sucio;
  if(NAV.length && NAV[NAV.length - 1].ov === id) navAtras(); else ov.classList.remove('open');
}
// 06NOVV3-MOVIL (2026-11-06, a petición de César): en Pendientes todo se guarda al momento; salir solo pregunta si quedó texto sin agregar.
document.addEventListener('input', e=>{ const ov = e.target.closest && e.target.closest('.ov'); if(ov && ov.id !== 'ov-pendientes') ov.dataset.sucio = '1'; if(ov && ov.id === 'ov-pendientes'){ if(String(($('pdTexto') || {}).value || '').trim()) ov.dataset.sucio = '1'; else delete ov.dataset.sucio; } }, true);

/* Vistas */
const VISTAS = { dashboard:'Dashboard', adendum:'Adendum', clientes:'Clientes', tramites:'Trámites', tareas:'Tareas', preciosak:'Precios AK', cotizacion:'Cotización', masivo:'Masivo' };
const VISTAS_SIN_CLIENTE = ['preciosak', 'masivo'];
let VISTA = 'dashboard';
function mostrarVista_(v){
  VISTA = v;
  document.querySelectorAll('.m-screen').forEach(s=> s.classList.toggle('active', s.id === 'screen-' + v));
  document.querySelectorAll('#mNav button').forEach(b=> b.classList.toggle('active', b.dataset.screen === v));
  $('mVista').textContent = VISTAS[v] || '';
  $('mMain').scrollTop = 0;
  pintarChipCliente_();
  (ENTRAR[v] || (()=>{}))();
}
function irA(v){
  if(v === VISTA) return;
  const anterior = VISTA;
  navPush_({ deshacer: ()=> mostrarVista_(anterior) });
  mostrarVista_(v);
}
$('mNav').addEventListener('click', e=>{ const b = e.target.closest('button[data-screen]'); if(b) irA(b.dataset.screen); });
const ENTRAR = {};   // vista -> función al entrar (se definen abajo)

/* Cliente activo: elegido en Dashboard (o Clientes / Adendum / Tareas), filtra Tareas, Trámites, Cotización, Adendum y
   Clientes al entrar. La ✕ de la etiqueta lo quita en todas. */
let CLI = null;
function clienteActivoSet_(row){ CLI = row || null; pintarChipCliente_(); }
function clienteActivoQuitar_(){ if(!CLI) return; CLI = null; pintarChipCliente_(); (QUITAR_CLIENTE[VISTA] || (()=>{}))(); }
const QUITAR_CLIENTE = {};
function pintarChipCliente_(){
  const ver = !!CLI && !VISTAS_SIN_CLIENTE.includes(VISTA);
  $('cliChip').classList.toggle('hidden', !ver);
  $('mVista').classList.toggle('hidden', ver);
  if(CLI) $('cliChipTxt').textContent = CLI['CLIENTE CORTO'] || razonDe_(CLI);
}
$('cliChipX').addEventListener('click', clienteActivoQuitar_);
</script>

   ============================================================================ */

}

});

function faltantes_(row){ const f = REQUERIDOS.filter(([k])=> !cfVal(row, k)).map(([, l])=> l); if(![1,2,3].some(n=> cfVal(row, `CONTACTO EMPRESA ${n} NOMBRE`))) f.push('Contacto de la empresa'); return f; }
function faltanHTML_(row){ const f = faltantes_(row); return f.length ? `<span class="faltan" title="${esc(f.join(', '))}" onclick="notificar('Faltan: ${esc(f.join(', ')).replace(/'/g, '')}', 'aviso')">Faltan ${f.length} dato${f.length === 1 ? '' : 's'}</span>` : ''; }
const ICO_TEL = '<svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>';

}

document.addEventListener('contextmenu', e=>{ const el = e.target.closest('.copiable'); if(el && el.dataset.copiar){ e.preventDefault(); navigator.clipboard && navigator.clipboard.writeText(el.dataset.copiar).then(()=> notificar('Copiado: ' + el.dataset.copiar, 'ok')).catch(()=>{}); } });

/* ============================================================================
   DASHBOARD (42.3, 42.4): búsqueda por cliente o por número; ficha con líneas, datos, correos y cajas
   ============================================================================ */

function adResDe_(row){ const rfc = norm_(cfVal(row, 'RFC')); return rfc ? DATA.adRes.find(r=> norm_(r['RFC']) === rfc) || null : null; }

function ticketsDe_(row){ const rfc = norm_(cfVal(row, 'RFC')), c = norm_(row['CLIENTE CORTO']); return DATA.tickets.filter(t=> (rfc && norm_(t['RFC']) === rfc) || (c && norm_(t['CLIENTE CORTO']) === c)); }
const ticketAbierto_ = t=> String(t['ESTATUS'] || '').toUpperCase() !== 'CERRADO' && !String(t['FECHA CIERRE'] || '').trim();
function dashPintar_(){

    <div class="tarjeta">

      <div class="v copiable" data-copiar="${esc(razonDe_(row))}" style="font-size:18px; font-weight:600; margin-top:6px">${esc(razonDe_(row))}</div>

    </div>
    <div class="sec"><div class="sec-t">Representante legal</div>
      <div class="v" style="font-weight:600">${esc(cfVal(row, 'REPRESENTANTE LEGAL') || '—')}</div>
      ${dato_('Correo', cfVal(row, 'CORREO REP LEGAL'), { mail:true })}

    </div>
    <div class="sec" style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px;">

/* ===== Correos de Telcel en el móvil (04NOVV3-MOVIL, 2026-11-04, a petición de César, #162 fase 2, P42) =====
   Los pendientes que trae Apps Script (getCorreosTelcel), con su texto y adjuntos. «Aceptar» en ESCALADA y AUTORIZADA de renovación
   (marcan solo pasos, igual que el escritorio: con la fecha del correo y el correo guardado en el paso; el correo se reserva APLICANDO para
   que dos paneles no lo apliquen a la vez). RENOVACIÓN APLICADA, AUTORIZADA de líneas nuevas y FACTURA escriben en Master (INICIO, MC,
   IMEI / ICCID, facturas) y por ahora se aceptan en el escritorio (pendiente en la cola). «Ya lo revisé» y «Descartar» en todos. */
function correosAbrir_(){ abrirOv_('ov-correos'); correosPintar_(); cargar('correos', true).then(correosPintar_); }
// 06NOVV1 (#176): solo si se ligó por número / ticket / a mano y su tipo corresponde al trámite
function correosAceptable_(c){ return c.TRAMITE && trmCorreoDelTramite_(c, c.TRAMITE) && (c.TIPO === 'ESCALADA' || (c.TIPO === 'AUTORIZADA' && /SOLICITUD DE RENOVACI/i.test(String(c.ASUNTO || '')))); }
function correosPintar_(){
  const L = (TRM_CORREOS || []).filter(c=> c.ESTADO === 'PENDIENTE').sort((a, b)=> (trmFechaDe_(b['FECHA CORREO']) || 0) - (trmFechaDe_(a['FECHA CORREO']) || 0));
  $('crLista').innerHTML = L.length ? L.map(c=>{
    const p = trmCorreoPartes_(c), adj = trmCorreoAdjuntos_(c), id = esc(c['MESSAGE ID']);
    return `<div class="correo"><div style="display:flex; justify-content:space-between; gap:8px;"><b>${esc(trmCorreoNombrePaso_(c.TIPO))}</b><span class="k">${esc(c['FECHA CORREO'] || '')}</span></div>
      <div class="k">${esc(c.TRAMITE || 'sin trámite ligado')}${c.CLIENTE ? ' · ' + esc(c.CLIENTE) : ''}</div>
      <div style="font-size:13px; margin:4px 0">${esc(c.ASUNTO || '')}</div>
      <details><summary class="k">Ver el texto${adj.length ? ' y ' + adj.length + ' adjunto(s)' : ''}</summary><div class="hist">${esc(p.nuevo || '(sin texto)')}</div>${adj.length ? `<div class="k">Adjuntos: ${esc(adj.join(', '))}</div>` : ''}</details>
      <div class="correo-acc">
        ${correosAceptable_(c) ? `<button type="button" class="btn-prim" data-cr-ok="${id}">Aceptar</button>` : `<span class="k">${c.TRAMITE ? 'Se acepta en el escritorio' : 'Sin trámite: se liga en el escritorio'}</span>`}
        <button type="button" class="btn-sec" data-cr-rev="${id}">Ya lo revisé</button><button type="button" class="btn-sec" data-cr-x="${id}">Descartar</button></div></div>`;
  }).join('') : '<div class="vacio-panel">No hay correos de Telcel por revisar.</div>';
}
async function correoEstado_(id, estado, tramite){ return post_({ action:'marcarCorreoTelcel', messageId: id, estado, tramite: tramite || '', usuario: usuarioNombre_() }); }
async function correoAceptar_(c){
  const t = DATA.trm.find(x=> x['FOLIO TRAMITE'] === c.TRAMITE); if(!t){ notificar('El trámite no está cargado.', 'error'); return; }
  const P = trmPasos_(t), r = trmResumen_(t), id = c['MESSAGE ID'];
  const fecha = /^\d{2}\/\d{2}\/\d{4} \d{2}:\d{2}$/.test(String(c['FECHA CORREO'] || '').trim()) ? String(c['FECHA CORREO']).trim() : String(c['FECHA CORREO'] || '').slice(0, 10) + ' 12:00';
  const nota = trmCorreoNotaAuto_(id), xe = P.lista.find(y=> y.p.id === 'r.escal'), items = [];
  if(c.TIPO === 'ESCALADA'){
    if(!xe || xe.hecho){ notificar('ESCALADA ya está marcada en ' + t['FOLIO TRAMITE'] + '.', 'aviso'); return; }
    items.push(trmPasoItem_(t, r, P, xe, fecha, nota, { messageId: id }));
  } else {
    const conEsc = !!(xe && !xe.hecho);
    if(conEsc) items.push(trmPasoItem_(t, r, P, xe, fecha, nota, { messageId: id }));
    const P2 = conEsc ? Object.assign({}, P, { listas: P.listas.map(l=> ({ tipo: l.tipo, lista: l.lista.map(y=> y === xe ? Object.assign({}, y, { hecho: true }) : y) })) }) : P;
    const xa = P2.listas.flatMap(l=> l.lista).find(y=> y.p.id === 'r.aut');
    if(!xa){ notificar('El trámite no tiene AUTORIZADA de renovación.', 'error'); return; }
    if(xa.hecho){ notificar('AUTORIZADA ya está marcada.', 'aviso'); return; }
    items.push(trmPasoItem_(t, r, P2, xa, fecha, nota, { messageId: id }));
  }
  if(!confirm(`¿Marcar ${items.map(i=> i.etiqueta).join(' y ')} en ${t['FOLIO TRAMITE']} con la fecha del correo (${c['FECHA CORREO']})?`)) return;
  const res0 = await correoEstado_(id, 'APLICANDO').catch(err=> ({ ok:false, error: err.message }));
  if(!res0 || res0.ok !== true){ notificar('Otro panel ya está aplicando este correo (o falta pegar CorreosAutomaticos.gs).', 'aviso'); return; }
  try{
    const res = await post_({ action:'marcarPasosTramite', pasos: items, usuario: usuarioNombre_() });
    trmMovilAplicarResp_(res);
    await correoEstado_(id, 'APLICADO', t['FOLIO TRAMITE']);
    c.ESTADO = 'APLICADO (' + usuarioNombre_() + ')';
    notificar(`${t['FOLIO TRAMITE']}: ${items.map(i=> i.etiqueta).join(' y ')} con el correo de Telcel.`, 'ok');
  }catch(err){
    await correoEstado_(id, 'PENDIENTE').catch(()=>{});
    notificar('No se pudo aplicar el correo: ' + err.message, 'error');
  }
  correosPintar_();
}

/* ===== MIS PENDIENTES en el móvil (04NOVV1-MOVIL, 2026-11-04, a petición de César, #166 P8–P10) =====

    PEND.lista = r.pendientes || []; $('pdEstado').textContent = '';
  }catch(err){ $('pdEstado').textContent = /no reconocida|no válida/i.test(err.message) ? 'Falta pegar Pendientes.gs y Codigo.gs en Apps Script (Nueva versión).' : 'Sin conexión: ' + err.message; }
  pendPintar_();
}
async function pendAccion_(datos){
  try{ const r = await post_(Object.assign({ action:'pendientesAccion', usuarioKey: CURRENT_USER_KEY }, datos)); PEND.lista = r.pendientes || []; }
  catch(err){ notificar('Mis pendientes: ' + err.message, 'error'); }
  pendPintar_();
}
function pendPintar_(){
  const yo = String(CURRENT_USER_KEY || '').toLowerCase();

      <div><span class="t">${esc(n.t)}</span>${n.comp ? '<span class="tag">COMPARTIDO</span>' : ''}${quien ? `<div class="k">${esc(quien)}</div>` : ''}</div>
      <div class="acc">${mio ? `<button type="button" data-pd-sh="${esc(n.id)}">${n.comp ? 'Privado' : 'Compartir'}</button>` : ''}<button type="button" data-pd-x="${esc(n.id)}" aria-label="Borrar">✕</button></div></div>`;
  }).join('') || '<div class="vacio-panel">Sin pendientes.</div>';
  const n = PEND.lista.filter(x=> !x.ok).length;

let AD_CLI = null, AD_FILTRO = 'todas', AD_DET_ABIERTO = false;
function adLineas_(rfc){ const k = norm_(rfc); return DATA.adDet.filter(r=> norm_(r['RFC']) === k); }
function adMeses_(r){ const m = mesesHasta_(r['FIN']); if(m !== null) return m; const s = parseFloat(r['MESES RESTANTES']); return isNaN(s) ? null : s; }
function adExcluida_(r){ const renta = num_(r['RENTA']) || 0; return renta < 199 || /WIFI|INTERNET/.test(norm_(r['PLAN'])); }
let AD_MASTER_NUM = null;
function adLibre_(r){
